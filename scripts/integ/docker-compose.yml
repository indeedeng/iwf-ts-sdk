version: '3.9'

# Local iWF environment for integration tests. Mirrors the iwf-java-sdk setup.
# See .env for the default versions of the images below.
services:
  elasticsearch:
    container_name: temporal-elasticsearch-iwf
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    image: elasticsearch:${ELASTICSEARCH_VERSION}
    networks:
      - temporal-network
    expose:
      - 9200
  postgresql:
    container_name: temporal-postgresql-iwf
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    image: postgres:${POSTGRESQL_VERSION}
    networks:
      - temporal-network
    expose:
      - 5432
  temporal:
    container_name: temporal-iwf
    depends_on:
      - postgresql
      - elasticsearch
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=elasticsearch
      - ES_VERSION=v7
    image: temporalio/auto-setup:${TEMPORAL_VERSION}
    networks:
      - temporal-network
    ports:
      - 7233:7233
    labels:
      kompose.volume.type: configMap
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
  temporal-admin-tools:
    container_name: temporal-admin-tools-iwf
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    image: temporalio/admin-tools:${TEMPORAL_ADMIN_TOOLS_VERSION}
    networks:
      - temporal-network
    stdin_open: true
    tty: true
    volumes:
      - ./docker-compose-init.sh:/etc/temporal/init.sh
    entrypoint: sh -c "/etc/temporal/init.sh"
  iwf-server:
    container_name: iwf-server
    image: iworkflowio/iwf-server:latest # NOTE: you can pin a version tag like v1.0.0-RC6
    environment:
      # Rewrite worker urls of "localhost"/"127.0.0.1" so the dockerized server can reach a worker
      # running on the host (the CI/dev machine). host.docker.internal + the host-gateway alias below
      # works on both Docker Desktop (macOS) and Linux docker 20.10+; the old hardcoded 172.17.0.1 is
      # the Linux docker0 address and is unreachable from macOS. Override if your setup differs.
      - AUTO_FIX_WORKER_URL=${AUTO_FIX_WORKER_URL:-host.docker.internal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - temporal-network
    ports:
      - 8801:8801
    depends_on:
      - temporal
networks:
  temporal-network:
    driver: bridge
    name: temporal-network
